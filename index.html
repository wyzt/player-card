<style>
  @font-face { font-family: "Pixelify Sans"; src: url("assets/fonts/PixelifySans.ttf") format("truetype"); font-weight: 400 700; font-display: block; }
  @font-face { font-family: "PixelDigits"; src: url("assets/fonts/pixel-digits.woff2") format("woff2"); font-weight: 400 700; font-display: block; unicode-range: U+0030-0039, U+E000-E004; size-adjust: 80%; }
  @font-face { font-family: "FusionZH"; src: url("assets/fonts/fusion-pixel-zh.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "FusionJA"; src: url("assets/fonts/fusion-pixel-ja.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "FusionKO"; src: url("assets/fonts/fusion-pixel-ko.woff2") format("woff2"); font-display: block; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0912; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { width: 100%; height: 100%; }
  /* small landscape frames (X feed player): readable cover, see showCover() in game.js */
  #cover { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; cursor: pointer;
    background: #0b0912 url("assets/img/cover.jpg") center 70% / cover no-repeat; color: #fff; font-weight: 700; text-align: center; padding: 3.5vh 4vw 0; box-sizing: border-box; }
  #cover > div { text-shadow: 3px 0 #140812, -3px 0 #140812, 0 3px #140812, 0 -3px #140812, 2px 2px #140812, -2px -2px #140812, 2px -2px #140812, -2px 2px #140812; }
  #cover .cv-t { font-size: clamp(30px, 14vh, 76px); line-height: 1.05; color: #ffd36a; }
  #cover .cv-s { font-size: clamp(15px, 4.8vh, 24px); margin-top: 1vh; }
  #cover .cv-b { width: clamp(64px, 21vh, 116px); height: clamp(64px, 21vh, 116px); margin-top: 6vh; border-radius: 50%; background: rgba(192, 56, 28, 0.92);
    border: 4px solid #ffd36a; box-shadow: 0 0 0 4px rgba(20, 8, 18, 0.7), 0 0 30px rgba(255, 160, 60, 0.6); display: flex; align-items: center; justify-content: center; animation: cvp 1.2s ease-in-out infinite; text-shadow: none; }
  #cover .cv-b span { width: 0; height: 0; margin-left: 12%; border-style: solid; border-width: 1.05em 0 1.05em 1.75em; border-color: transparent transparent transparent #fff4c8; font-size: clamp(14px, 4.4vh, 24px); }
  #cover .cv-p { font-size: clamp(18px, 6.6vh, 34px); color: #fff2c0; margin-top: 2.2vh; background: rgba(20, 8, 18, 0.72); padding: 0.15em 0.7em; border-radius: 10px; }
  #cover .cv-n { font-size: 15px; margin-top: 1vh; color: #b8f0a0; }
  @keyframes cvp { 50% { transform: scale(1.08); } }
</style>
